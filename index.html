<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sharp Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090b;--surf:#111113;--card:#17171a;
  --bdr:#27272a;--bdr2:#3f3f46;
  --g:#22c55e;--a:#f59e0b;--r:#ef4444;--b:#3b82f6;
  --txt:#e4e4e7;--txt2:#a1a1aa;--mut:#52525b;--wh:#fafafa;
}
html,body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;min-height:100vh;font-size:14px}

.bar{position:sticky;top:0;z-index:50;background:rgba(9,9,11,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;height:52px}
.bar-brand{display:flex;align-items:center;gap:8px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--g);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.bar-title{font-size:14px;font-weight:600;color:var(--wh)}
.bar-right{display:flex;align-items:center;gap:10px}
.mut-clock{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--g);font-weight:500}
.mut-label{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;display:block;text-align:right;margin-top:1px}
.poll-cd{font-size:10px;color:var(--mut);font-family:'JetBrains Mono',monospace}

.statbar{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--bdr);border-bottom:1px solid var(--bdr)}
.stat{background:var(--surf);padding:.55rem 1rem}
.stat-l{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
.stat-v{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:500}

.fbar{display:flex;gap:5px;padding:.5rem 1.25rem;background:var(--surf);border-bottom:1px solid var(--bdr);overflow-x:auto}
.fl{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;align-self:center;flex-shrink:0;margin-right:2px}
.fc{border:1px solid var(--bdr);border-radius:20px;padding:3px 12px;font-size:11px;font-weight:500;color:var(--txt2);cursor:pointer;background:transparent;white-space:nowrap;font-family:'Inter',sans-serif;transition:all .12s;flex-shrink:0}
.fc:hover{border-color:var(--bdr2);color:var(--txt)}
.fc.on{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:var(--g)}
.fc.on-a{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3);color:var(--a)}
.fc.on-r{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:var(--r)}

.info-bar{font-size:11px;color:var(--txt2);padding:.35rem 1.25rem;background:var(--surf);border-bottom:1px solid var(--bdr);font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:8px}
.info-bar.err{color:var(--r)}

.main{padding:.75rem 1.25rem 3rem;max-width:860px;margin:0 auto}

/* HOW IT WORKS BANNER - shows only when no snapshot data yet */
.how-banner{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);border-radius:10px;padding:1rem 1.1rem;margin-bottom:1rem}
.how-title{font-size:12px;font-weight:600;color:var(--b);margin-bottom:.4rem}
.how-body{font-size:12px;color:var(--txt2);line-height:1.65}

.grp-hdr{display:flex;align-items:center;gap:8px;margin:1rem 0 .4rem;font-size:10px;font-weight:500;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.grp-line{flex:1;height:1px;background:var(--bdr)}

/* MATCH CARD */
.mc{border:1px solid var(--bdr);border-radius:10px;background:var(--card);padding:.85rem 1rem;margin-bottom:.4rem;position:relative;overflow:hidden;animation:up .2s ease both}
@keyframes up{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.mc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.mc.cw::before{background:var(--g)}.mc.cw{border-color:rgba(34,197,94,.15)}
.mc.cd::before{background:var(--a)}.mc.cd{border-color:rgba(245,158,11,.15)}
.mc.cs::before{background:var(--r)}.mc.cs{border-color:rgba(239,68,68,.2)}
.mc.cl::before{background:var(--r)}.mc.cl{border-color:rgba(239,68,68,.18)}
.mc.cx::before{background:var(--b)}
.mc.cn::before{background:var(--bdr2)}

.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:.6rem}
.mh-l .mt{font-size:13px;font-weight:600;color:var(--wh)}
.mh-l .mvs{color:var(--mut);font-weight:400;font-size:12px}
.mh-l .mm{font-size:10px;color:var(--txt2);margin-top:2px}
.badges{display:flex;gap:3px;flex-wrap:wrap;flex-shrink:0}
.bdg{font-size:9px;font-weight:600;padding:2px 7px;border-radius:20px;border:1px solid}
.bg{color:var(--g);border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.07)}
.ba{color:var(--a);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.07)}
.br{color:var(--r);border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.07)}
.bb{color:var(--b);border-color:rgba(59,130,246,.3);background:rgba(59,130,246,.07)}
.bm{color:var(--mut);border-color:var(--bdr)}

/* ODDS GRID */
.og{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:.6rem}
.oc{background:var(--surf);border:1px solid var(--bdr);border-radius:8px;padding:.5rem .6rem;text-align:center;position:relative}
.oc.pw{border-color:var(--g);background:rgba(34,197,94,.06);box-shadow:0 0 0 1px rgba(34,197,94,.08)}
.oc.pd{border-color:var(--a);background:rgba(245,158,11,.06);box-shadow:0 0 0 1px rgba(245,158,11,.08)}
.pick-pin{position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 8px;border-radius:0 0 6px 6px;white-space:nowrap}
.pick-pin.w{background:var(--g);color:#000}
.pick-pin.d{background:var(--a);color:#000}
.ot{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.ov{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:500;color:var(--wh)}
.om{font-family:'JetBrains Mono',monospace;font-size:10px;margin-top:2px}
.om.dn{color:var(--g)}.om.up{color:var(--r)}.om.fl{color:var(--mut)}
.op{font-size:9px;color:var(--mut);margin-top:1px}

/* waiting for snapshot */
.snap-wait{text-align:center;font-size:11px;color:var(--mut);padding:6px 0 10px;font-style:italic}

/* SIGNAL */
.sig-box{border-radius:8px;padding:.55rem .8rem;margin-bottom:.6rem;border:1px solid}
.sig-box.sw{background:rgba(34,197,94,.04);border-color:rgba(34,197,94,.18)}
.sig-box.sd{background:rgba(245,158,11,.04);border-color:rgba(245,158,11,.18)}
.sig-box.ss{background:rgba(239,68,68,.04);border-color:rgba(239,68,68,.15)}
.sig-box.sx{background:rgba(59,130,246,.03);border-color:rgba(59,130,246,.13)}
.sig-box.sn{background:var(--surf);border-color:var(--bdr)}
.sp{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;font-family:'JetBrains Mono',monospace;margin-bottom:3px}
.sp.g{color:var(--g)}.sp.a{color:var(--a)}.sp.r{color:var(--r)}.sp.b{color:var(--b)}.sp.m{color:var(--mut)}
.sr{font-size:11.5px;color:var(--txt2);line-height:1.6}
.scw{display:flex;align-items:center;gap:6px;margin-top:4px}
.scb{flex:1;height:3px;background:var(--bdr);border-radius:2px;overflow:hidden}
.scf{height:100%;border-radius:2px}

/* BET BOX */
.bet-box{display:flex;align-items:center;justify-content:space-between;padding:.6rem .85rem;border-radius:8px;border:1px solid;flex-wrap:wrap;gap:6px}
.bet-box.w{background:rgba(34,197,94,.06);border-color:rgba(34,197,94,.22)}
.bet-box.d{background:rgba(245,158,11,.06);border-color:rgba(245,158,11,.22)}
.bet-l{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:2px}
.bet-p{font-size:15px;font-weight:600}
.bet-p.g{color:var(--g)}.bet-p.a{color:var(--a)}
.bet-odds{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:500;color:var(--wh)}
.bet-ol{font-size:9px;color:var(--txt2);text-align:right;margin-bottom:1px}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 2rem;text-align:center;color:var(--txt2)}
.empty-i{font-size:2.5rem;margin-bottom:.75rem;opacity:.35}
.empty-h{font-size:16px;font-weight:500;color:var(--txt);margin-bottom:.35rem}
.empty-s{font-size:12px;line-height:1.65;max-width:300px}

@media(max-width:600px){
  .statbar{grid-template-columns:repeat(3,1fr)}
  .statbar .stat:nth-child(4),.statbar .stat:nth-child(5){display:none}
  .bar,.fbar,.main,.info-bar{padding-left:1rem;padding-right:1rem}
}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-brand">
    <div class="pulse" id="dot"></div>
    <span class="bar-title">Sharp Tracker</span>
  </div>
  <div class="bar-right">
    <div>
      <div class="mut-clock" id="clock">--:--:--</div>
      <span class="mut-label">Mauritius (UTC+4)</span>
    </div>
    <div class="poll-cd" id="cd">—</div>
  </div>
</div>

<div class="statbar">
  <div class="stat"><div class="stat-l">Total</div><div class="stat-v" id="st" style="color:var(--txt)">—</div></div>
  <div class="stat"><div class="stat-l">Live</div><div class="stat-v" id="sl" style="color:var(--r)">—</div></div>
  <div class="stat"><div class="stat-l">Win signals</div><div class="stat-v" id="sw" style="color:var(--g)">—</div></div>
  <div class="stat"><div class="stat-l">Draw signals</div><div class="stat-v" id="sd" style="color:var(--a)">—</div></div>
  <div class="stat"><div class="stat-l">Steam moves</div><div class="stat-v" id="ss" style="color:var(--r)">—</div></div>
</div>

<div class="fbar">
  <span class="fl">View</span>
  <button class="fc on"  onclick="filt('all',this)">All matches</button>
  <button class="fc"     onclick="filt('signal',this)">Signals only</button>
  <button class="fc"     onclick="filt('live',this)">Live now</button>
  <button class="fc"     onclick="filt('win',this)">Win</button>
  <button class="fc"     onclick="filt('draw',this)">Draw</button>
  <button class="fc"     onclick="filt('steam',this)">Steam</button>
  <button class="fc"     onclick="filt('high',this)">High conf</button>
</div>

<div class="info-bar" id="ib">⏳ Starting up — loading matches...</div>

<div class="main" id="main"></div>

<script>
// ══════════════════════════════════════════
//  SHARP TRACKER — self-building odds history
//  BSD API for matches + browser localStorage
//  for opening odds snapshot
// ══════════════════════════════════════════
const TOKEN  = '2e38c27f914805a1d3ecbfd8cb3e3354623295ac';
const BSD    = 'https://sports.bzzoiro.com';
const SNAP   = 'st_snap_v1';   // opening odds store
const POLL_S = 120;            // poll every 2 minutes

let allMatches = [], filter = 'all', cd = POLL_S, cdTmr = null;

// ── CLOCK ──
function pad(n){ return String(n).padStart(2,'0'); }
function mutStr(){
  const d = new Date(Date.now()+4*3600000);
  return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds());
}
function toMUT(utcStr){
  const d = new Date(utcStr);
  const m = new Date(d.getTime()+4*3600000);
  return pad(m.getUTCHours())+':'+pad(m.getUTCMinutes());
}
function toMins(t){ if(!t) return 9999; const p=t.split(':'); return (+p[0]||0)*60+(+p[1]||0); }
setInterval(()=>{ const el=document.getElementById('clock'); if(el) el.textContent=mutStr(); },1000);

// ── COUNTDOWN ──
function startCD(){
  if(cdTmr) clearInterval(cdTmr);
  cd=POLL_S;
  cdTmr=setInterval(()=>{
    cd--;
    const el=document.getElementById('cd');
    if(el) el.textContent='next update '+cd+'s';
    if(cd<=0){ clearInterval(cdTmr); fetchAll(); }
  },1000);
}

// ── OPENING ODDS STORE ──
// Saved as { matchId: { hP, dP, aP, savedAt } }
function loadSnap(){ return JSON.parse(localStorage.getItem(SNAP)||'{}'); }
function saveSnap(snap){ localStorage.setItem(SNAP,JSON.stringify(snap)); }

function recordOpening(id, hN, dN, aN){
  const snap = loadSnap();
  if(!snap[id]){
    snap[id] = { hP:hN, dP:dN, aP:aN, savedAt:Date.now() };
    saveSnap(snap);
  }
  return snap[id];
}

function getOpening(id, hN, dN, aN){
  const snap = loadSnap();
  if(snap[id]) return snap[id];
  // First time seeing this match — save current as opening
  return recordOpening(id, hN, dN, aN);
}

// Clean up finished matches from snap (older than 2 days)
function cleanSnap(){
  const snap = loadSnap();
  const cutoff = Date.now() - 2*86400000;
  let changed = false;
  for(const id in snap){
    if(snap[id].savedAt < cutoff){ delete snap[id]; changed=true; }
  }
  if(changed) saveSnap(snap);
}

// ── API ──
async function bsdGet(path){
  const r = await fetch(BSD+path,{headers:{'Authorization':'Token '+TOKEN,'Accept':'application/json'}});
  if(!r.ok) throw new Error('BSD '+r.status);
  return r.json();
}

// ── MAIN FETCH ──
async function fetchAll(){
  setDot('loading'); setIB('⟳ Updating...', false);
  try {
    const now = new Date();
    const df  = now.toISOString().slice(0,10);
    const tom = new Date(now.getTime()+86400000).toISOString().slice(0,10);

    const [liveR, upR] = await Promise.all([
      bsdGet('/api/live/?limit=200'),
      bsdGet('/api/events/?date_from='+df+'&date_to='+tom+'&limit=200')
    ]);

    const liveIds = new Set((liveR.results||[]).map(e=>e.id));
    const liveEvts = (liveR.results||[]).map(e=>({...e,isLive:true}));
    const upcoming = (upR.results||[])
      .filter(e=>!liveIds.has(e.id)&&new Date(e.event_date)>now)
      .map(e=>({...e,isLive:false}));

    const all = [...liveEvts,...upcoming];

    // Fetch detail in batches
    const withD = await fetchBatch(all);

    cleanSnap();

    allMatches = withD.map(analyse).filter(Boolean);
    allMatches.sort((a,b)=>{
      if(a.isLive&&!b.isLive) return -1;
      if(!a.isLive&&b.isLive) return 1;
      return toMins(a.koMUT)-toMins(b.koMUT)||b.conf-a.conf;
    });

    const lc=allMatches.filter(m=>m.isLive).length;
    const wc=allMatches.filter(m=>m.sig==='WIN').length;
    const dc=allMatches.filter(m=>m.sig==='DRAW').length;
    const t=new Date(Date.now()+4*3600000);
    setIB('✓ Updated '+pad(t.getUTCHours())+':'+pad(t.getUTCMinutes())+' MUT · '+allMatches.length+' matches · '+lc+' live · '+wc+' win signals · '+dc+' draw signals', false);
    setDot('live');
    updateStats();
    renderVisible();
    startCD();

  } catch(e){
    setIB('⚠ '+e.message+' — will retry', true);
    setDot('err');
    startCD();
  }
}

async function fetchBatch(events){
  const out=[], sz=8;
  for(let i=0;i<events.length;i+=sz){
    const batch=events.slice(i,i+sz);
    const settled=await Promise.allSettled(
      batch.map(e=>bsdGet('/api/events/'+e.id+'/').then(d=>({...e,...d})).catch(()=>e))
    );
    settled.forEach(r=>{ if(r.status==='fulfilled') out.push(r.value); });
  }
  return out;
}

// ── ANALYSIS ──
function analyse(e){
  // Extract current odds
  let hN=fl(e.odds_home||e.home_win_odds||e.home_odds||0);
  let dN=fl(e.odds_draw||e.draw_win_odds||e.draw_odds||0);
  let aN=fl(e.odds_away||e.away_win_odds||e.away_odds||0);

  // Try bookmakers array
  if((!hN||!dN||!aN)&&e.bookmakers&&e.bookmakers.length){
    const bk=e.bookmakers.find(b=>(b.name||'').toLowerCase().includes('365'))||e.bookmakers[0];
    if(bk){ hN=fl(bk.home||hN);dN=fl(bk.draw||dN);aN=fl(bk.away||aN); }
  }

  const isLive=e.isLive||e.status==='inprogress';
  const koMUT=toMUT(e.event_date);
  const hasOdds=hN>0&&dN>0&&aN>0;

  // Get or create opening snapshot
  let hP=hN,dP=dN,aP=aN;
  let hasSnapshot=false;
  if(hasOdds){
    const snap=getOpening(e.id,hN,dN,aN);
    hP=snap.hP; dP=snap.dP; aP=snap.aP;
    // If snap was just created now, opening = current (no movement yet)
    hasSnapshot=(snap.savedAt<Date.now()-60000); // at least 1 min old
  }

  const hM=hasOdds?pct(hP,hN):0;
  const dM=hasOdds?pct(dP,dN):0;
  const aM=hasOdds?pct(aP,aN):0;

  let sig,pick,betOn=null,steam=false,conf=0,pattern,patType,reason;

  if(!hasOdds){
    sig='WATCH';pattern='No odds yet';patType='x';conf=0;
    reason='Odds not yet published for this match.';
  } else if(!hasSnapshot){
    sig='WATCH';pattern='Building snapshot...';patType='x';conf=0;
    reason='First time seeing this match. Opening odds recorded. Movement will show on next update in 2 minutes.';
  } else if(hM>=7&&dM<0&&aM<0){
    sig='WIN';pick='Home win';betOn=e.home_team;steam=true;
    conf=Math.min(88,70+Math.floor(hM*1.5));
    pattern='⚡ Steam move — home';patType='r';
    reason='Home dropped '+hM.toFixed(1)+'% ('+f(hP)+'→'+f(hN)+') while draw drifted '+Math.abs(dM).toFixed(1)+'% and away drifted '+Math.abs(aM).toFixed(1)+'%. All sharp money pointing onto '+e.home_team+'.';
  } else if(aM>=7&&hM<0&&dM<0){
    sig='WIN';pick='Away win';betOn=e.away_team;steam=true;
    conf=Math.min(88,70+Math.floor(aM*1.5));
    pattern='⚡ Steam move — away';patType='r';
    reason='Away dropped '+aM.toFixed(1)+'% ('+f(aP)+'→'+f(aN)+') while home drifted '+Math.abs(hM).toFixed(1)+'% and draw drifted '+Math.abs(dM).toFixed(1)+'%. Sharp money on '+e.away_team+'.';
  } else if(hM<=-10&&aM>=5){
    sig='WIN';pick='Away win';betOn=e.away_team;steam=true;
    conf=Math.min(84,65+Math.floor(aM));
    pattern='⚡ Reverse steam';patType='r';
    reason='Home drifted '+Math.abs(hM).toFixed(1)+'% while away dropped '+aM.toFixed(1)+'%. Public on home, sharps loading away.';
  } else if(dM>=4&&hM<0&&aM<0){
    sig='DRAW';pick='Draw';betOn='Draw';
    conf=Math.min(74,58+Math.floor(dM*2));
    pattern='Draw compression';patType='a';
    reason='Draw dropped '+dM.toFixed(1)+'% ('+f(dP)+'→'+f(dN)+') while home drifted '+Math.abs(hM).toFixed(1)+'% and away drifted '+Math.abs(aM).toFixed(1)+'%. Sharp money on the draw at '+f(dN)+'.';
  } else if(hM>=3&&hM<7&&aM<=0){
    sig='WIN';pick='Home win';betOn=e.home_team;
    conf=Math.min(65,50+Math.floor(hM*5));
    pattern='Soft home move';patType='g';
    reason='Home dropped '+hM.toFixed(1)+'% ('+f(hP)+'→'+f(hN)+'). Steady money toward '+e.home_team+'.';
  } else if(aM>=3&&aM<7&&hM<=0){
    sig='WIN';pick='Away win';betOn=e.away_team;
    conf=Math.min(65,50+Math.floor(aM*5));
    pattern='Soft away move';patType='g';
    reason='Away dropped '+aM.toFixed(1)+'% ('+f(aP)+'→'+f(aN)+'). Steady money toward '+e.away_team+'.';
  } else if(Math.abs(hM)<0.3&&Math.abs(dM)<0.3&&Math.abs(aM)<0.3){
    sig='SKIP';pattern='Flat — no movement';patType='n';conf=0;
    reason='All odds unchanged since opening. No sharp activity on this match.';
  } else {
    sig='WATCH';pattern='Mixed movement';patType='x';
    conf=Math.min(40,10+Math.floor(Math.max(Math.abs(hM),Math.abs(dM),Math.abs(aM))*3));
    reason='Unclear direction — Home '+(hM>0?'▼':'▲')+Math.abs(hM).toFixed(1)+'% · Draw '+(dM>0?'▼':'▲')+Math.abs(dM).toFixed(1)+'% · Away '+(aM>0?'▼':'▲')+Math.abs(aM).toFixed(1)+'%. Watching for clearer signal.';
  }

  return{
    id:e.id,home:e.home_team||'?',away:e.away_team||'?',
    league:e.league_name||'',koMUT,isLive,
    score:isLive?((e.home_score??0)+' — '+(e.away_score??0)):'',
    minute:e.current_minute||'',
    hP,hN,dP,dN,aP,aN,hM,dM,aM,
    hasOdds,hasSnapshot,
    sig,pick,betOn,steam,conf,pattern,patType,reason
  };
}

// ── RENDER ──
function filt(f,btn){
  filter=f;
  document.querySelectorAll('.fc').forEach(b=>b.className='fc');
  btn.classList.add(f==='draw'?'on-a':f==='steam'||f==='live'?'on-r':'on');
  renderVisible();
}

function renderVisible(){
  let vis=allMatches;
  if(filter==='signal') vis=allMatches.filter(m=>m.sig==='WIN'||m.sig==='DRAW');
  else if(filter==='live') vis=allMatches.filter(m=>m.isLive);
  else if(filter==='win') vis=allMatches.filter(m=>m.sig==='WIN');
  else if(filter==='draw') vis=allMatches.filter(m=>m.sig==='DRAW');
  else if(filter==='steam') vis=allMatches.filter(m=>m.steam);
  else if(filter==='high') vis=allMatches.filter(m=>m.conf>=70);
  renderList(vis);
}

function renderList(matches){
  const wrap=document.getElementById('main');

  // Show snapshot info banner if this is first run
  const snap=loadSnap();
  const hasAnySnap=Object.keys(snap).length>0;
  const notYetHours=!hasAnySnap;
  const bannerHTML=notYetHours?`<div class="how-banner">
    <div class="how-title">Building your odds history — first run</div>
    <div class="how-body">The app just recorded opening odds for all matches. In 2 minutes it will compare and show any sharp money movement. Check back after the next update to see signals highlighted. This banner disappears once you have data.</div>
  </div>`:'';

  if(!matches.length){
    wrap.innerHTML=bannerHTML+`<div class="empty"><div class="empty-i">📭</div><div class="empty-h">No matches</div><div class="empty-s">No matches for this filter right now.</div></div>`;
    return;
  }

  let html=bannerHTML;
  let lastKey=null;
  matches.forEach((m,i)=>{
    const key=m.isLive?'__live__':m.koMUT;
    if(key!==lastKey){
      const grp=matches.filter(x=>(x.isLive?'__live__':x.koMUT)===key);
      const sigs=grp.filter(x=>x.sig==='WIN'||x.sig==='DRAW'||x.steam).length;
      const lbl=m.isLive?'Live now':m.koMUT+' MUT';
      const sigsLbl=sigs?' · '+sigs+' signal'+(sigs>1?'s':''):'';
      html+=`<div class="grp-hdr"><span class="grp-line"></span><span>${esc(lbl)+esc(sigsLbl)}</span><span class="grp-line"></span></div>`;
      lastKey=key;
    }
    html+=mkCard(m,i);
  });
  wrap.innerHTML=html;
}

function mkCard(m,i){
  const isW=m.sig==='WIN',isD=m.sig==='DRAW';
  const isH=m.betOn===m.home,isA=m.betOn===m.away,isDrw=m.betOn==='Draw';

  let cls='mc';
  if(m.steam) cls+=' cs';
  else if(m.isLive) cls+=' cl';
  else if(isW) cls+=' cw';
  else if(isD) cls+=' cd';
  else if(m.sig==='WATCH') cls+=' cx';
  else cls+=' cn';

  // Badges
  let bdgs='';
  if(m.isLive) bdgs+=`<span class="bdg br">● Live ${esc(m.score)}${m.minute?' '+m.minute+"'":''}`;
  if(m.steam)  bdgs+='<span class="bdg br">⚡ Steam</span>';
  if(isW&&m.conf>=70) bdgs+='<span class="bdg bg">Win signal</span>';
  else if(isW) bdgs+='<span class="bdg bg">Win</span>';
  if(isD&&m.conf>=65) bdgs+='<span class="bdg ba">Draw signal</span>';
  else if(isD) bdgs+='<span class="bdg ba">Draw</span>';
  if(m.sig==='WATCH'&&!m.isLive) bdgs+='<span class="bdg bb">Monitor</span>';
  if(m.sig==='SKIP') bdgs+='<span class="bdg bm">Skip</span>';

  // Odds
  let oddsHTML;
  if(!m.hasOdds){
    oddsHTML='<div class="snap-wait">Odds not yet published for this match</div>';
  } else if(!m.hasSnapshot){
    oddsHTML=`<div class="og">
      ${['Home','Draw','Away'].map((lbl,idx)=>{
        const v=[m.hN,m.dN,m.aN][idx];
        return `<div class="oc"><div class="ot">${lbl}</div><div class="ov">${f(v)}</div><div class="om fl">opening…</div><div class="op">first seen now</div></div>`;
      }).join('')}
    </div>`;
  } else {
    const hMov=mvStr(m.hM),dMov=mvStr(m.dM),aMov=mvStr(m.aM);
    const hCls='oc'+(isH?' pw':''), dCls='oc'+(isDrw?' pd':''), aCls='oc'+(isA?' pw':'');
    oddsHTML=`<div class="og">
      <div class="${hCls}">
        ${isH?'<div class="pick-pin w">Bet this</div>':''}
        <div class="ot" style="margin-top:${isH?'10px':'0'}">Home</div>
        <div class="ov">${f(m.hN)}</div>
        <div class="om ${m.hM>0?'dn':m.hM<0?'up':'fl'}">${hMov}</div>
        <div class="op">open ${f(m.hP)}</div>
      </div>
      <div class="${dCls}">
        ${isDrw?'<div class="pick-pin d">Bet this</div>':''}
        <div class="ot" style="margin-top:${isDrw?'10px':'0'}">Draw</div>
        <div class="ov">${f(m.dN)}</div>
        <div class="om ${m.dM>0?'dn':m.dM<0?'up':'fl'}">${dMov}</div>
        <div class="op">open ${f(m.dP)}</div>
      </div>
      <div class="${aCls}">
        ${isA?'<div class="pick-pin w">Bet this</div>':''}
        <div class="ot" style="margin-top:${isA?'10px':'0'}">Away</div>
        <div class="ov">${f(m.aN)}</div>
        <div class="om ${m.aM>0?'dn':m.aM<0?'up':'fl'}">${aMov}</div>
        <div class="op">open ${f(m.aP)}</div>
      </div>
    </div>`;
  }

  // Signal box
  const sbc='sig-box s'+m.patType;
  const cc=m.conf>=70?'var(--g)':m.conf>=50?'var(--a)':'var(--r)';
  const confHTML=m.conf>0?`<div class="scw"><div class="scb"><div class="scf" style="width:${m.conf}%;background:${cc}"></div></div><span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--txt2)">${m.conf}%</span></div>`:'';
  const sigHTML=`<div class="${sbc}">
    <div class="sp ${m.patType}">${esc(m.pattern)}</div>
    <div class="sr">${esc(m.reason)}</div>
    ${confHTML}
  </div>`;

  // Bet box
  let betHTML='';
  if((isW||isD)&&m.hasSnapshot){
    const ent=isH?m.hN:isA?m.aN:isDrw?m.dN:0;
    betHTML=`<div class="bet-box ${isD?'d':'w'}">
      <div><div class="bet-l">📌 Bet selection</div>
      <div class="bet-p ${isD?'a':'g'}">${esc(m.pick)}${m.betOn?' — '+esc(m.betOn):''}</div></div>
      ${ent?`<div><div class="bet-ol">Entry odds (bet365)</div><div class="bet-odds">${f(ent)}</div></div>`:''}
    </div>`;
  }

  const timeDisp=m.isLive?'In progress':m.koMUT+' MUT';
  return `<div class="${cls}" style="animation-delay:${i*.025}s">
    <div class="mh">
      <div class="mh-l">
        <div class="mt">${esc(m.home)} <span class="mvs">vs</span> ${esc(m.away)}</div>
        <div class="mm">${esc(m.league)} · ${esc(timeDisp)}</div>
      </div>
      <div class="badges">${bdgs}</div>
    </div>
    ${oddsHTML}
    ${sigHTML}
    ${betHTML}
  </div>`;
}

function updateStats(){
  document.getElementById('st').textContent=allMatches.length||'—';
  document.getElementById('sl').textContent=allMatches.filter(m=>m.isLive).length||'—';
  document.getElementById('sw').textContent=allMatches.filter(m=>m.sig==='WIN').length||'—';
  document.getElementById('sd').textContent=allMatches.filter(m=>m.sig==='DRAW').length||'—';
  document.getElementById('ss').textContent=allMatches.filter(m=>m.steam).length||'—';
}
function setIB(msg,err){ const el=document.getElementById('ib'); el.textContent=msg; el.className='info-bar'+(err?' err':''); }
function setDot(s){ const d=document.getElementById('dot'); d.style.background=s==='live'?'var(--g)':s==='loading'?'var(--a)':'var(--r)'; }
function mvStr(p){ if(!p||Math.abs(p)<0.1) return 'flat'; return (p>0?'▼':'▲')+' '+Math.abs(p).toFixed(1)+'%'; }
function pct(p,n){ return(!p||!n||p===n)?0:((p-n)/p)*100; }
function f(v){ return v?Number(v).toFixed(2):'—'; }
function fl(v){ return parseFloat(v)||0; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── BOOT ──
fetchAll();
</script>
</body>
</html>
